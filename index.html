<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life - Custom Rules</title>

  <!-- 1. Favicon Placeholder (Replace href with your icon path) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">

  <!-- 2. Vercel Analytics Script -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Canvas Screen */
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #gameCanvas:active {
      cursor: grabbing;
    }

    /* Top Right Controls (Language Selector) */
    .top-right-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
    }

    /* HUD Stats (Top Left) */
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      min-width: 210px;
    }

    .hud h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-weight: 600;
      font-family: monospace;
      color: #38bdf8;
    }

    /* Controller (Bottom Bar) */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 24px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    /* Slider & Labels */
    .speed-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .speed-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }

    .speed-val {
      color: #38bdf8;
      font-family: monospace;
    }

    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Bn/Sn Rule Selector */
    .rule-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rule-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rule-title {
      font-size: 12px;
      font-weight: bold;
      width: 20px;
      color: #38bdf8;
    }

    .rule-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #64748b;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .rule-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .select-dropdown {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .select-dropdown:hover {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Language Switcher (Top Right) -->
  <div class="top-right-bar">
    <select id="langSelect" class="select-dropdown">
      <option value="en" selected>English</option>
      <option value="ko">한국어</option>
    </select>
  </div>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Stats -->
  <div class="hud">
    <h2 id="txtHudTitle">Simulation Stats</h2>
    <div class="stat-row">
      <span id="txtPopulation">Population:</span>
      <span class="stat-value" id="statPopulation">0</span>
    </div>
    <div class="stat-row">
      <span id="txtBorn">Total Born:</span>
      <span class="stat-value" id="statBorn">0</span>
    </div>
    <div class="stat-row">
      <span id="txtDied">Total Died:</span>
      <span class="stat-value" id="statDied">0</span>
    </div>
    <div class="stat-row">
      <span id="txtGen">Generation:</span>
      <span class="stat-value" id="statGen">0</span>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <!-- Play/Pause, Random, Clear -->
    <div class="control-group">
      <button class="btn btn-primary" id="btnPlay">Play</button>
      <button class="btn" id="btnRandom">Random</button>
      <button class="btn" id="btnClear">Clear</button>
    </div>

    <!-- Speed Slider with Gen/Frame display -->
    <div class="control-group speed-container">
      <div class="speed-header">
        <span id="txtSpeedLabel">Speed:</span>
        <span class="speed-val" id="statGenPerFrame">0.17 Gen/Frame</span>
      </div>
      <input type="range" id="speedSlider" min="1" max="120" value="10">
    </div>

    <!-- Presets -->
    <div class="control-group">
      <select id="presetSelect" class="select-dropdown">
        <option value="B3/S23">Conway (B3/S23)</option>
        <option value="B36/S23">HighLife (B36/S23)</option>
        <option value="B2/S">Seeds (B2/S)</option>
        <option value="B3678/S34678">Day & Night (B3678/S34678)</option>
        <option value="B1/S12">Flock (B1/S12)</option>
      </select>
    </div>

    <!-- Bn/Sn Rules Toggles -->
    <div class="rule-box">
      <div class="rule-row" id="bRules">
        <span class="rule-title">B:</span>
      </div>
      <div class="rule-row" id="sRules">
        <span class="rule-title">S:</span>
      </div>
    </div>
  </div>

  <script>
    // i18n Translations Dictionary
    const translations = {
      en: {
        hudTitle: "Simulation Stats",
        population: "Population:",
        born: "Total Born:",
        died: "Total Died:",
        gen: "Generation:",
        speed: "Speed:",
        play: "Play",
        pause: "Pause",
        random: "Random",
        clear: "Clear"
      },
      ko: {
        hudTitle: "시뮬레이션 통계",
        population: "현재 개체 수:",
        born: "총 태어난 수:",
        died: "총 죽은 수:",
        gen: "진행 세대:",
        speed: "속도:",
        play: "재생",
        pause: "일시정지",
        random: "랜덤 생성",
        clear: "초기화"
      }
    };

    let currentLang = "en";

    // Canvas & Context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const langSelect = document.getElementById('langSelect');
    const btnPlay = document.getElementById('btnPlay');
    const btnRandom = document.getElementById('btnRandom');
    const btnClear = document.getElementById('btnClear');
    const speedSlider = document.getElementById('speedSlider');
    const statGenPerFrame = document.getElementById('statGenPerFrame');
    const presetSelect = document.getElementById('presetSelect');
    const bRulesContainer = document.getElementById('bRules');
    const sRulesContainer = document.getElementById('sRules');

    // Text Elements for i18n
    const txtHudTitle = document.getElementById('txtHudTitle');
    const txtPopulation = document.getElementById('txtPopulation');
    const txtBorn = document.getElementById('txtBorn');
    const txtDied = document.getElementById('txtDied');
    const txtGen = document.getElementById('txtGen');
    const txtSpeedLabel = document.getElementById('txtSpeedLabel');

    const statPopulation = document.getElementById('statPopulation');
    const statBorn = document.getElementById('statBorn');
    const statDied = document.getElementById('statDied');
    const statGen = document.getElementById('statGen');

    // Grid Specs
    const GRID_SIZE = 150;
    const CELL_SIZE = 16;
    let grid = createGrid();

    // Game Rules
    let birthRules = new Set([3]);
    let survivalRules = new Set([2, 3]);

    // Statistics
    let stats = {
      population: 0,
      totalBorn: 0,
      totalDied: 0,
      generation: 0
    };

    // Animation & Speed Control
    let isRunning = false;
    let speedValue = 10; // Slider 1 to 120
    let stepAccumulator = 0;
    let animationFrameId = null;

    // Viewport State (Zoom & Pan)
    let scale = 1.0;
    let offsetX = (window.innerWidth - GRID_SIZE * CELL_SIZE) / 2;
    let offsetY = (window.innerHeight - GRID_SIZE * CELL_SIZE) / 2;

    let isDragging = false;
    let startX = 0, startY = 0;
    let dragDistance = 0;

    function createGrid() {
      return Array.from({ length: GRID_SIZE }, () => new Uint8Array(GRID_SIZE));
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // Rule Buttons Initialization
    function initRuleButtons() {
      for (let i = 0; i <= 8; i++) {
        // Birth Buttons
        const bBtn = document.createElement('button');
        bBtn.className = `rule-btn ${birthRules.has(i) ? 'active' : ''}`;
        bBtn.innerText = i;
        bBtn.onclick = () => {
          if (birthRules.has(i)) birthRules.delete(i);
          else birthRules.add(i);
          bBtn.classList.toggle('active');
        };
        bRulesContainer.appendChild(bBtn);

        // Survival Buttons
        const sBtn = document.createElement('button');
        sBtn.className = `rule-btn ${survivalRules.has(i) ? 'active' : ''}`;
        sBtn.innerText = i;
        sBtn.onclick = () => {
          if (survivalRules.has(i)) survivalRules.delete(i);
          else survivalRules.add(i);
          sBtn.classList.toggle('active');
        };
        sRulesContainer.appendChild(sBtn);
      }
    }

    function updateRuleUI() {
      Array.from(bRulesContainer.children).forEach((child, idx) => {
        if (idx > 0) child.classList.toggle('active', birthRules.has(idx - 1));
      });
      Array.from(sRulesContainer.children).forEach((child, idx) => {
        if (idx > 0) child.classList.toggle('active', survivalRules.has(idx - 1));
      });
    }

    // Step Execution
    function step() {
      const nextGrid = createGrid();
      let bornThisStep = 0;
      let diedThisStep = 0;
      let currentPop = 0;

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const neighbors = countNeighbors(r, c);
          const isAlive = grid[r][c] === 1;

          let nextState = isAlive ? (survivalRules.has(neighbors) ? 1 : 0) : (birthRules.has(neighbors) ? 1 : 0);
          nextGrid[r][c] = nextState;

          if (nextState === 1) currentPop++;
          if (!isAlive && nextState === 1) bornThisStep++;
          if (isAlive && nextState === 0) diedThisStep++;
        }
      }

      grid = nextGrid;
      stats.population = currentPop;
      stats.totalBorn += bornThisStep;
      stats.totalDied += diedThisStep;
      stats.generation++;
    }

    function countNeighbors(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = (r + dr + GRID_SIZE) % GRID_SIZE;
          const nc = (c + dc + GRID_SIZE) % GRID_SIZE;
          count += grid[nr][nc];
        }
      }
      return count;
    }

    function updateHUD() {
      statPopulation.innerText = stats.population;
      statBorn.innerText = stats.totalBorn;
      statDied.innerText = stats.totalDied;
      statGen.innerText = stats.generation;
    }

    // Main Game Loop (Targeting 60FPS)
    function gameLoop() {
      if (isRunning) {
        // Calculate Generations per Frame ratio
        // Slider value 60 = 1 Gen / Frame (60 Gen/sec)
        const genPerFrame = speedValue / 60;
        stepAccumulator += genPerFrame;

        while (stepAccumulator >= 1) {
          step();
          stepAccumulator -= 1;
        }

        updateHUD();
        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    // Canvas Drawing with Grid Lines
    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      const totalWidth = GRID_SIZE * CELL_SIZE;
      const totalHeight = GRID_SIZE * CELL_SIZE;

      // Grid Background
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, totalWidth, totalHeight);

      // Render Cells
      ctx.fillStyle = '#38bdf8';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === 1) {
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        }
      }

      // Render Thin Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1 / scale;
      ctx.beginPath();
      for (let x = 0; x <= totalWidth; x += CELL_SIZE) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, totalHeight);
      }
      for (let y = 0; y <= totalHeight; y += CELL_SIZE) {
        ctx.moveTo(0, y);
        ctx.lineTo(totalWidth, y);
      }
      ctx.stroke();

      ctx.restore();
    }

    // Update Speed Display (Gen / Frame)
    function updateSpeedDisplay() {
      speedValue = parseInt(speedSlider.value, 10);
      const genPerFrame = (speedValue / 60).toFixed(2);
      statGenPerFrame.innerText = `${genPerFrame} Gen/Frame`;
    }

    // Language Change Handler
    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      txtHudTitle.innerText = t.hudTitle;
      txtPopulation.innerText = t.population;
      txtBorn.innerText = t.born;
      txtDied.innerText = t.died;
      txtGen.innerText = t.gen;
      txtSpeedLabel.innerText = t.speed;

      btnPlay.innerText = isRunning ? t.pause : t.play;
      btnRandom.innerText = t.random;
      btnClear.innerText = t.clear;
    }

    langSelect.onchange = (e) => {
      changeLanguage(e.target.value);
    };

    // Canvas Pan & Zoom Mouse Events
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
      dragDistance = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX - offsetX;
      const dy = e.clientY - startY - offsetY;
      dragDistance += Math.abs(dx) + Math.abs(dy);

      offsetX = e.clientX - startX;
      offsetY = e.clientY - startY;
      draw();
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging && dragDistance < 5) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left - offsetX) / scale;
        const mouseY = (e.clientY - rect.top - offsetY) / scale;

        const col = Math.floor(mouseX / CELL_SIZE);
        const row = Math.floor(mouseY / CELL_SIZE);

        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
          grid[row][col] = grid[row][col] ? 0 : 1;
          stats.population += grid[row][col] ? 1 : -1;
          updateHUD();
          draw();
        }
      }
      isDragging = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(0.2, scale * zoomFactor), 5.0);

      const mouseX = e.clientX;
      const mouseY = e.clientY;

      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;

      draw();
    }, { passive: false });

    // Controls Event Handlers
    btnPlay.onclick = () => {
      isRunning = !isRunning;
      const t = translations[currentLang];
      btnPlay.innerText = isRunning ? t.pause : t.play;
      btnPlay.classList.toggle('btn-primary', !isRunning);

      if (isRunning) {
        stepAccumulator = 0;
        gameLoop();
      } else {
        cancelAnimationFrame(animationFrameId);
      }
    };

    speedSlider.oninput = () => {
      updateSpeedDisplay();
    };

    btnRandom.onclick = () => {
      grid = createGrid();
      let pop = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (Math.random() < 0.25) {
            grid[r][c] = 1;
            pop++;
          }
        }
      }
      stats = { population: pop, totalBorn: pop, totalDied: 0, generation: 0 };
      updateHUD();
      draw();
    };

    btnClear.onclick = () => {
      if (isRunning) btnPlay.click();
      grid = createGrid();
      stats = { population: 0, totalBorn: 0, totalDied: 0, generation: 0 };
      updateHUD();
      draw();
    };

    presetSelect.onchange = (e) => {
      const val = e.target.value;
      const [bPart, sPart] = val.split('/');

      birthRules = new Set(bPart.replace('B', '').split('').map(Number));
      survivalRules = new Set(sPart.replace('S', '').split('').map(Number));

      updateRuleUI();
    };

    // App Initialization
    initRuleButtons();
    updateSpeedDisplay();
    resizeCanvas();
    btnRandom.click();
  </script>
</body>
</html>
