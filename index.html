<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life - Custom Bn/Sn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Canvas Screen */
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #gameCanvas:active {
      cursor: grabbing;
    }

    /* HUD Stats (좌측 상단) */
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      min-width: 180px;
    }

    .hud h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-weight: 600;
      font-family: monospace;
      color: #38bdf8;
    }

    /* Controller (하단 바) */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 24px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      max-width: 90vw;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    /* Slider */
    label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Bn/Sn Rule Selector */
    .rule-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rule-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rule-title {
      font-size: 12px;
      font-weight: bold;
      width: 20px;
      color: #38bdf8;
    }

    .rule-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #64748b;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .rule-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .preset-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Stats -->
  <div class="hud">
    <h2>시뮬레이션 통계</h2>
    <div class="stat-row">
      <span>현재 개체 수:</span>
      <span class="stat-value" id="statPopulation">0</span>
    </div>
    <div class="stat-row">
      <span>총 태어난 수:</span>
      <span class="stat-value" id="statBorn">0</span>
    </div>
    <div class="stat-row">
      <span>총 죽은 수:</span>
      <span class="stat-value" id="statDied">0</span>
    </div>
    <div class="stat-row">
      <span>진행 세대:</span>
      <span class="stat-value" id="statGen">0</span>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <!-- Play/Pause, Reset, Random -->
    <div class="control-group">
      <button class="btn btn-primary" id="btnPlay">재생</button>
      <button class="btn" id="btnRandom">랜덤 생성</button>
      <button class="btn" id="btnClear">초기화</button>
    </div>

    <!-- Speed Slider -->
    <div class="control-group">
      <label for="speedSlider">속도</label>
      <input type="range" id="speedSlider" min="10" max="500" value="100" step="10">
    </div>

    <!-- Presets -->
    <div class="control-group">
      <select id="presetSelect" class="preset-select">
        <option value="B3/S23">Conway (B3/S23)</option>
        <option value="B36/S23">HighLife (B36/S23)</option>
        <option value="B2/S">Seeds (B2/S)</option>
        <option value="B3678/S34678">Day & Night (B3678/S34678)</option>
        <option value="B1/S12">Flock (B1/S12)</option>
      </select>
    </div>

    <!-- Bn/Sn Rules Toggles -->
    <div class="rule-box">
      <div class="rule-row" id="bRules">
        <span class="rule-title">B:</span>
        <!-- Buttons 0~8 generated via JS -->
      </div>
      <div class="rule-row" id="sRules">
        <span class="rule-title">S:</span>
        <!-- Buttons 0~8 generated via JS -->
      </div>
    </div>
  </div>

  <script>
    // Canvas & Context Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const btnPlay = document.getElementById('btnPlay');
    const btnRandom = document.getElementById('btnRandom');
    const btnClear = document.getElementById('btnClear');
    const speedSlider = document.getElementById('speedSlider');
    const presetSelect = document.getElementById('presetSelect');
    const bRulesContainer = document.getElementById('bRules');
    const sRulesContainer = document.getElementById('sRules');

    const statPopulation = document.getElementById('statPopulation');
    const statBorn = document.getElementById('statBorn');
    const statDied = document.getElementById('statDied');
    const statGen = document.getElementById('statGen');

    // Grid Dimensions
    const GRID_SIZE = 150; // 150x150 cells
    const CELL_SIZE = 16;
    let grid = createGrid();

    // Game Rules (Sets for O(1) lookups)
    let birthRules = new Set([3]);
    let survivalRules = new Set([2, 3]);

    // Statistics
    let stats = {
      population: 0,
      totalBorn: 0,
      totalDied: 0,
      generation: 0
    };

    // State Variables
    let isRunning = false;
    let timer = null;
    let speed = 100; // ms per tick

    // Viewport State (Zoom & Pan)
    let scale = 1.0;
    let offsetX = (window.innerWidth - GRID_SIZE * CELL_SIZE) / 2;
    let offsetY = (window.innerHeight - GRID_SIZE * CELL_SIZE) / 2;

    let isDragging = false;
    let startX = 0, startY = 0;
    let dragDistance = 0;

    // Helper: Create 2D Array
    function createGrid() {
      return Array.from({ length: GRID_SIZE }, () => new Uint8Array(GRID_SIZE));
    }

    // Resize Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // Initialize Rule UI Buttons
    function initRuleButtons() {
      for (let i = 0; i <= 8; i++) {
        // Birth Buttons
        const bBtn = document.createElement('button');
        bBtn.className = `rule-btn ${birthRules.has(i) ? 'active' : ''}`;
        bBtn.innerText = i;
        bBtn.onclick = () => {
          if (birthRules.has(i)) birthRules.delete(i);
          else birthRules.add(i);
          bBtn.classList.toggle('active');
        };
        bRulesContainer.appendChild(bBtn);

        // Survival Buttons
        const sBtn = document.createElement('button');
        sBtn.className = `rule-btn ${survivalRules.has(i) ? 'active' : ''}`;
        sBtn.innerText = i;
        sBtn.onclick = () => {
          if (survivalRules.has(i)) survivalRules.delete(i);
          else survivalRules.add(i);
          sBtn.classList.toggle('active');
        };
        sRulesContainer.appendChild(sBtn);
      }
    }

    function updateRuleUI() {
      Array.from(bRulesContainer.children).forEach((child, idx) => {
        if (idx > 0) child.classList.toggle('active', birthRules.has(idx - 1));
      });
      Array.from(sRulesContainer.children).forEach((child, idx) => {
        if (idx > 0) child.classList.toggle('active', survivalRules.has(idx - 1));
      });
    }

    // Game Logic Update Step
    function step() {
      const nextGrid = createGrid();
      let bornThisStep = 0;
      let diedThisStep = 0;
      let currentPop = 0;

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const neighbors = countNeighbors(r, c);
          const isAlive = grid[r][c] === 1;

          let nextState = 0;
          if (isAlive) {
            nextState = survivalRules.has(neighbors) ? 1 : 0;
          } else {
            nextState = birthRules.has(neighbors) ? 1 : 0;
          }

          nextGrid[r][c] = nextState;

          if (nextState === 1) currentPop++;
          if (!isAlive && nextState === 1) bornThisStep++;
          if (isAlive && nextState === 0) diedThisStep++;
        }
      }

      grid = nextGrid;
      stats.population = currentPop;
      stats.totalBorn += bornThisStep;
      stats.totalDied += diedThisStep;
      stats.generation++;

      updateHUD();
      draw();
    }

    function countNeighbors(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = (r + dr + GRID_SIZE) % GRID_SIZE;
          const nc = (c + dc + GRID_SIZE) % GRID_SIZE;
          count += grid[nr][nc];
        }
      }
      return count;
    }

    function updateHUD() {
      statPopulation.innerText = stats.population;
      statBorn.innerText = stats.totalBorn;
      statDied.innerText = stats.totalDied;
      statGen.innerText = stats.generation;
    }

    // Render Function
    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Grid Background
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, GRID_SIZE * CELL_SIZE, GRID_SIZE * CELL_SIZE);

      // Draw Cells
      ctx.fillStyle = '#38bdf8';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === 1) {
            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
          }
        }
      }

      ctx.restore();
    }

    // Canvas Mouse / Touch Controls (Pan & Zoom)
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
      dragDistance = 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX - offsetX;
      const dy = e.clientY - startY - offsetY;
      dragDistance += Math.abs(dx) + Math.abs(dy);

      offsetX = e.clientX - startX;
      offsetY = e.clientY - startY;
      draw();
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging && dragDistance < 5) {
        // Toggle Cell on Click (not Drag)
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left - offsetX) / scale;
        const mouseY = (e.clientY - rect.top - offsetY) / scale;

        const col = Math.floor(mouseX / CELL_SIZE);
        const row = Math.floor(mouseY / CELL_SIZE);

        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
          grid[row][col] = grid[row][col] ? 0 : 1;
          stats.population += grid[row][col] ? 1 : -1;
          updateHUD();
          draw();
        }
      }
      isDragging = false;
    });

    // Zoom on Wheel
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(0.2, scale * zoomFactor), 5.0);

      // Zoom centered at mouse cursor
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;

      draw();
    }, { passive: false });

    // Controls Event Handlers
    btnPlay.onclick = () => {
      isRunning = !isRunning;
      btnPlay.innerText = isRunning ? '일시정지' : '재생';
      btnPlay.classList.toggle('btn-primary', !isRunning);

      if (isRunning) {
        timer = setInterval(step, 510 - speed);
      } else {
        clearInterval(timer);
      }
    };

    speedSlider.oninput = (e) => {
      speed = parseInt(e.target.value, 10);
      if (isRunning) {
        clearInterval(timer);
        timer = setInterval(step, 510 - speed);
      }
    };

    btnRandom.onclick = () => {
      grid = createGrid();
      let pop = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (Math.random() < 0.25) {
            grid[r][c] = 1;
            pop++;
          }
        }
      }
      stats = { population: pop, totalBorn: pop, totalDied: 0, generation: 0 };
      updateHUD();
      draw();
    };

    btnClear.onclick = () => {
      if (isRunning) btnPlay.click();
      grid = createGrid();
      stats = { population: 0, totalBorn: 0, totalDied: 0, generation: 0 };
      updateHUD();
      draw();
    };

    presetSelect.onchange = (e) => {
      const val = e.target.value;
      const [bPart, sPart] = val.split('/');

      birthRules = new Set(bPart.replace('B', '').split('').map(Number));
      survivalRules = new Set(sPart.replace('S', '').split('').map(Number));

      updateRuleUI();
    };

    // Initialize Application
    initRuleButtons();
    resizeCanvas();
    btnRandom.click(); // Initial random population
  </script>
</body>
</html>
